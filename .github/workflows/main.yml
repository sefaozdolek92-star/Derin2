name: Derin 2.0 APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Derin Audi RS7 ZIP'i aç
        run: |
          ZIP="./Derin_Audi_RS7_v0.6_SesliUyandirma.zip"
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Android projesini bul
        run: |
          SETTINGS=$(find project \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: XML hatasını düzelt
        run: |
          XML=$(find project -path "*/app/src/main/res/layout/activity_main.xml" | head -1)
          sed -i 's/android:hintTextColor="[^"]*"//g' "$XML"

      - name: APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: APK'yı hazırla
        uses: actions/upload-artifact@v4
        with:
          name: Derin-Audi-RS7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
